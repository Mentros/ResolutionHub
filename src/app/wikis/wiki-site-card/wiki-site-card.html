<div
  crsdCard
  variant="elevated"
  class="flex flex-col gap-0 p-5 transition-colors hover:border-primary/40"
>
  <a
    class="flex flex-col gap-2 no-underline text-inherit"
    [routerLink]="['/wikis', site.id]"
  >
    <h2 crsdCardTitle class="text-xl leading-snug">{{ site.name }}</h2>
    @if (site.summary) {
      <p crsdCardDescription class="line-clamp-3 text-sm leading-relaxed">{{ site.summary }}</p>
    }
    @if (site.searchSnippet) {
      <p class="line-clamp-2 text-xs text-muted-foreground">{{ site.searchSnippet }}</p>
    }
  </a>

  <app-search-card-footer
    [statLabel]="entryLabel(site.entryCount)"
    [updatedAt]="site.updatedAt"
    [tags]="site.tags"
    tagFilterPath="/wikis"
  />
</div>
