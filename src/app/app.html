<div class="min-h-screen bg-background text-foreground">
  <header class="sticky top-0 z-10 border-b border-border bg-background">
    <div [class]="headerBar">
      <a
        routerLink="/"
        class="brand inline-flex shrink-0 items-center gap-3 no-underline text-foreground"
      >
        <span
          class="flex size-9 items-center justify-center rounded-sm bg-primary text-xs font-bold text-primary-foreground"
          aria-hidden="true"
        >
          RH
        </span>

        <span class="text-xl font-semibold tracking-tight">Resolution Hub</span>
      </a>

      <app-global-search class="min-w-0 flex-1" />

      <div
        class="flex shrink-0 items-center gap-1 w-[6rem] sm:w-[10.5rem]"
        aria-label="Erscheinungsbild"
      >
        <app-theme-toggle />
        <app-color-mode-toggle />
      </div>

      <nav class="flex shrink-0 items-center gap-0.5" aria-label="Hauptnavigation">
        <a
          routerLink="/"
          routerLinkActive="bg-muted text-foreground"
          [routerLinkActiveOptions]="{ exact: true }"
          class="inline-flex h-9 items-center rounded-sm px-3 text-sm font-medium text-muted-foreground no-underline transition-colors hover:bg-muted/70 hover:text-foreground"
        >
          Tickets
        </a>

        <a
          routerLink="/wikis"
          routerLinkActive="bg-muted text-foreground"
          class="inline-flex h-9 items-center rounded-sm px-3 text-sm font-medium text-muted-foreground no-underline transition-colors hover:bg-muted/70 hover:text-foreground"
        >
          Wikis
        </a>

        <a
          routerLink="/tags"
          routerLinkActive="bg-muted text-foreground"
          [routerLinkActiveOptions]="{ exact: true }"
          class="inline-flex h-9 items-center rounded-sm px-3 text-sm font-medium text-muted-foreground no-underline transition-colors hover:bg-muted/70 hover:text-foreground"
        >
          Bezeichnungen
        </a>
      </nav>
    </div>
  </header>

  <main [class]="mainContent">
    <router-outlet />
  </main>
</div>
