<div crsdField>
  <span crsdLabel id="tag-label">Tags</span>
  <div class="flex flex-col gap-2">
    @if (tags().length > 0) {
      <ul class="flex flex-wrap gap-2 p-0 m-0 list-none">
        @for (tag of tags(); track tag) {
          <li crsdBadge color="secondary" class="gap-1">
            {{ tag }}
            <button
              type="button"
              class="border-0 bg-transparent p-0 text-inherit leading-none"
              [attr.aria-label]="'Remove ' + tag"
              (click)="removeTag(tag)"
            >
              ×
            </button>
          </li>
        }
      </ul>
    }
    @if (pickableOptions().length > 0) {
      <div
        crsdSelect
        class="w-full"
        aria-labelledby="tag-label"
        [value]="pickerValue()"
        (valueChange)="onPick($event)"
      >
        <button crsdSelectTrigger type="button">
          <span crsdSelectPlaceholder class="text-muted-foreground">Add a tag</span>
          <crsd-icon name="chevron-down" class="ml-auto opacity-50" />
        </button>
        <ng-template crsdSelectPortal>
          <ul crsdSelectContent [options]="pickableOptions()"></ul>
        </ng-template>
      </div>
    }
  </div>
  <p crsdFieldDescription>
    Choose tags from the list.
    <a routerLink="/tags" class="text-primary hover:underline">Manage tags</a>
    to add new names.
  </p>
  @if (error()) {
    <div crsdAlert variant="error">
      <p crsdAlertDescription>{{ error() }}</p>
    </div>
  }
</div>
