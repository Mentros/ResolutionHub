<fieldset class="m-0 flex flex-col gap-4 border-0 p-0">
  <legend class="text-sm font-medium">Schritte</legend>
  <p crsdFieldDescription>
    Die Lösung steht in der Anweisung. Optional: Link zu einer externen Seite (https) oder Pfad zu einem Freigabeordner.
  </p>
  @for (step of checkpoints(); track step.key; let index = $index, first = $first, last = $last) {
    <div crsdCard class="gap-4 p-4">
      <div class="flex flex-wrap items-center justify-between gap-3">
        <h2 class="text-lg font-semibold">Schritt {{ index + 1 }}</h2>
        <div class="flex flex-wrap gap-2">
          <button type="button" crsdBtn variant="outline" size="sm" (click)="move(step.key, -1)" [disabled]="first">
            Nach oben
          </button>
          <button type="button" crsdBtn variant="outline" size="sm" (click)="move(step.key, 1)" [disabled]="last">
            Nach unten
          </button>
          <button type="button" crsdBtn variant="outline" size="sm" color="destructive" (click)="remove(step.key)">
            Entfernen
          </button>
        </div>
      </div>
      <div crsdField>
        <label crsdLabel [attr.for]="'checkpoint-instruction-' + step.key">Was zu tun ist</label>
        <textarea
          [id]="'checkpoint-instruction-' + step.key"
          crsdTextarea
          class="min-h-24"
          rows="3"
          [value]="step.instruction"
          (valueChange)="setField(step.key, 'instruction', $event)"
        ></textarea>
      </div>
      <div crsdField>
        <label crsdLabel [attr.for]="'checkpoint-wiki-' + step.key">Externe Dokumentation (URL)</label>
        <input
          [id]="'checkpoint-wiki-' + step.key"
          type="url"
          crsdInput
          [value]="step.wikiUrl"
          (valueChange)="setField(step.key, 'wikiUrl', $event)"
          placeholder="https://wiki.example/teams-join"
        />
      </div>
      <div crsdField>
        <label crsdLabel [attr.for]="'checkpoint-share-' + step.key">Freigabeordner</label>
        <input
          [id]="'checkpoint-share-' + step.key"
          crsdInput
          [value]="step.sharePath"
          (valueChange)="setField(step.key, 'sharePath', $event)"
          placeholder="\\server\share\folder"
          spellcheck="false"
        />
      </div>
    </div>
  }
  <button type="button" crsdBtn variant="outline" (click)="add()">Schritt hinzufügen</button>
</fieldset>
