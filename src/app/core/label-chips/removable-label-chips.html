@if (labels.length > 0) {
  <ul class="flex flex-wrap gap-1.5 p-0 m-0 list-none">
    @for (name of labels; track name) {
      <li class="max-w-full min-w-0">
        <crsd-removable-badge
          variant="soft"
          [color]="color"
          size="sm"
          [removeLabel]="name + ' entfernen'"
          [attr.title]="name"
          class="max-w-full"
          (dismiss)="removeLabel.emit(name)"
        >
          <span class="truncate">{{ name }}</span>
        </crsd-removable-badge>
      </li>
    }
  </ul>
}
