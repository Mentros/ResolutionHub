<div class="flex flex-col gap-3 border-b border-border/50 pb-4">
  <div class="flex flex-wrap items-center gap-2">
    @if (statLabel) {
      <span crsdBadge variant="outline" color="secondary" size="sm" class="shrink-0 tabular-nums">
        {{ statLabel }}
      </span>
    }
    <time
      class="text-sm tabular-nums text-muted-foreground"
      [attr.datetime]="updatedAt"
    >
      Aktualisiert am {{ updatedAt | date: 'medium' }}
    </time>
  </div>

  @if (programs.length > 0 || topics.length > 0) {
    <div class="flex flex-wrap items-center gap-1.5">
      @if (programs.length > 0) {
        <app-tag-list
          class="search-card-chips"
          [tags]="programs"
          kind="program"
          [collapseAfter]="collapseAfter"
        />
      }
      @if (topics.length > 0) {
        <app-tag-list
          class="search-card-chips"
          [tags]="topics"
          kind="topic"
          [collapseAfter]="collapseAfter"
        />
      }
    </div>
  }

  <div class="flex flex-wrap gap-2">
    <ng-content />
  </div>
</div>
